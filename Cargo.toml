[package]
name = "layer-silence-cut-h"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HexBrowns"]
description = "LayerSilenceCut_H - 指定したレイヤーの音声で無音を見つけ、指定したレイヤーだけを切って詰める AviUtl2 プラグイン"
publish = false

[lib]
name = "layer_silence_cut_h"
crate-type = ["cdylib", "rlib"]

[dependencies]
aviutl2 = { version = "0.48", features = ["generic"] }
aviutl2-eframe = "0.48"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
